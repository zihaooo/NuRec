# @package _global_
# Control for 3dgut_dynamic_ecad.yaml: the generic AV MCMC preset with the same regularisers (scale 1e-3, opacity
# 5e-3, both off from step 25k) and nothing else changed, so ECAD's effect can be separated from the regulariser stop.

defaults:
  - /apps/AV/_base_3dgut_dynamic.yaml
  - /apps/AV/module_mixins/_mcmc_mixin.yaml
  - override /model/gaussians/strategy@model.strategy: mcmc

loss:
  gaussian_scale:
    lambda_: 0.001
    lambda_scheduler:
      name: linear_lambda
      start: 25000
      end: 25100
      update_interval: step
      update_frequency: 1
      lambda_end: 0.0
  gaussian_density:
    lambda_scheduler:
      name: linear_lambda
      start: 25000
      end: 25100
      update_interval: step
      update_frequency: 1
      lambda_end: 0.0
